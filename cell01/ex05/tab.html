<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>
</head>

<style>
    table {
        width: 100%;
        border-collapse: collapse;
    }

    td {
        width: 50%;
        border: 1px solid black;
        box-sizing: border-box;
        font-size: 32px;
    }

    td:nth-child(1) {
        background-color: rgb(189, 50, 0);
    }

    td:nth-child(2) {
        background-color: rgb(120, 176, 255);
    }
</style>

<body>
    <hr>

    <table>
        <tr>
            <td>
                oh ho kon thai
            </td>

            <td>
                whatzzzzzz
            </td>
        </tr>
    </table>

</body>
</html>
